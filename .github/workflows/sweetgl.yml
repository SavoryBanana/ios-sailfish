name: sweetgl

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa git ref or tag to build"
        default: "main"
  push:
    branches: [main]
    paths:
      - "tools/sweetgl/**"
      - ".github/workflows/sweetgl.yml"

concurrency:
  group: sweetgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install meson ninja pkgconf
          python3 -m pip install --break-system-packages mako pyyaml packaging
          if which python >/dev/null; then
            python -m pip install --break-system-packages mako pyyaml packaging || true
          fi
          if [ -x /Library/Frameworks/Python.framework/Versions/Current/bin/python ]; then
            /Library/Frameworks/Python.framework/Versions/Current/bin/python -m pip install --break-system-packages mako pyyaml packaging || true
          fi
          python3 -c "import mako, yaml, packaging; print('Python deps OK')"

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Fetch and patch Mesa
        run: |
          mkdir -p research
          MESA_REF="${{ inputs.mesa_version || 'main' }}"
          git clone --depth 1 --branch "$MESA_REF" https://gitlab.freedesktop.org/mesa/mesa.git research/mesa
          cd research/mesa
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/tools/sweetgl/mesa.patch"

      - name: Setup Mesa build
        run: |
          bash tools/sweetgl/mesa-setup.sh

      - name: Build sweetgl.dylib
        run: |
          bash tools/sweetgl/build.sh
          ls -la tools/sweetgl/out/

      - uses: actions/upload-artifact@v4
        with:
          name: sweetgl
          path: tools/sweetgl/out/sweetgl.dylib
